<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이콘 정하기 — 하다 관리 앱</title>
<link rel="stylesheet" href="hada-tokens.css">
<style>
:root{--bg:#F6EFE7;--card:#fff;--ink:#2B2520;--muted:#7A6E63;--line:#E2D6C8;--line2:#EFE6DB;--brand:#6B5B4B;--soft:#F1E8DD;--warn:#B7791F;--warnbg:#FFF4D6;--ok:#2F7A4C;--okbg:#E3F3E6;--bad:#B04A3A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans KR",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 24px 12px}
h1{margin:0 0 4px;font-size:22px}.sub{color:var(--muted);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip,.btn{height:32px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.btn:disabled{opacity:.45;cursor:default}
.chip small{font-weight:400;opacity:.8}
input.q{height:32px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:13px;min-width:200px;background:var(--card)}
.sp{flex:1}
main{padding:16px 24px 80px;max-width:1280px}
.grp{margin:24px 0 8px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}.grp small{font-weight:400;color:var(--muted);font-size:12px}
.row{display:grid;grid-template-columns:44px minmax(160px,1.2fr) minmax(160px,1.6fr) 150px auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row.dup{border-color:var(--warn)}.row.done{border-color:var(--ok)}
.ic{width:40px;height:40px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.ic svg,.ic img{width:22px;height:22px}.ic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.new{background:var(--okbg);color:var(--ok)}
.nm b{font-size:14px}.nm .k{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 8px}
.nm .al{display:block;color:var(--muted);font-size:12px}.nm .sel{display:inline-flex;vertical-align:middle;margin-right:6px}.nm .sel input{width:16px;height:16px;accent-color:var(--brand)}.nm .k.mk{background:var(--okbg);color:var(--ok)}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}.lab{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}.lab:has(input:checked){border-color:var(--brand);background:var(--soft)}
.pl{font-size:12px;color:var(--muted)}.pl .w{display:block;color:var(--warn);font-weight:600;margin-top:2px}
.pick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.pick code{font-size:12px;color:var(--ink)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.acts .btn{height:32px;padding:0 10px}
.req{grid-column:2/-1;font-size:12px;background:var(--warnbg);border-radius:10px;padding:8px 10px;white-space:pre-wrap}
dialog{border:0;border-radius:14px;padding:0;width:min(920px,94vw);max-height:88vh;box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(40,30,20,.4)}
.dh{position:sticky;top:0;background:#fff;padding:16px 20px 12px;border-bottom:1px solid var(--line2);z-index:1}.dh h2{margin:0 0 8px;font-size:17px}
.dh .bar{margin-top:8px}.db{padding:16px 20px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cell{border:1px solid var(--line2);border-radius:10px;padding:10px 4px 6px;text-align:center;cursor:pointer;background:#fff;font:inherit;color:var(--ink)}
.cell:hover{border-color:var(--brand);background:var(--soft)}.cell.cur{outline:2px solid var(--brand)}.cell.used{background:var(--warnbg)}
.cell svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cell span{display:block;font-size:11px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell i{display:block;font-style:normal;font-size:10px;color:var(--warn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.hint{color:var(--muted);font-size:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
@media(max-width:820px){.row{grid-template-columns:44px 1fr}.row>.pl,.row>.pick,.row>.acts{grid-column:1/-1}.acts{justify-content:flex-start}header,main{padding-left:16px;padding-right:16px}}
</style></head><body>

  {const ub=$("#undoOp");ub.disabled=!OPS.length;ub.textContent=OPS.length?`묶음 되돌리기 ${OPS.length}`:"묶음 되돌리기";ub.title=OPS.length?`마지막 묶음 고치기를 되돌려요: ${opText(OPS[OPS.length-1])}`:"나누고 합치고 이름 고친 것이 없어요"}
  $("#fDup").classList.toggle("on",fDup);$("#fTodo").classList.toggle("on",fTodo);
  let list=rows.filter(r=>fKind==="전체"||r.kind===fKind);
  if(Q)list=list.filter(r=>(r.mean+" "+r.labels.join(" ")+" "+r.places.join(" ")+" "+r.icons.join(" ")).toLowerCase().includes(Q));

  if(fTodo)list=list.filter(r=>{const d=DEC[key(r)];return !(d&&(d.pick||d.svg||d.req))});
  let h="",last="";list.forEach(r=>{if(r.kind!==last){last=r.kind;h+=`<div class="grp">${r.kind} <small>${DATA.kindHelp[r.kind]||""}</small></div>`}
    const d=DEC[key(r)]||{},e=eff(r),others=dm[dk(r)]&&dm[dk(r)].size>1?[...dm[dk(r)]].filter(x=>x!==r.mean):[];const changed=d.pick||d.svg;
    h+=`<div class="row ${others.length?"dup":""} ${changed||d.req?"done":""}" data-key="${esc(key(r))}"><div class="ic" title="지금: ${esc(r.icons.join(", "))}">${iconHtml(r)}</div>
    <div class="nm"><label class="sel" title="합칠 줄 고르기"><input type="checkbox" data-sel="${esc(key(r))}" ${SEL.has(key(r))?"checked":""}></label><b>${esc(r.mean)}</b><span class="k">${r.kind}</span>${r.made?`<span class="k mk">${r.made}</span>`:""}${r.labels.length>1||r.labels[0]!==r.mean?`<span class="al">${esc(r.labels.slice(0,12).join(" · "))}${r.labels.length>12?` 외 ${r.labels.length-12}`:""}</span>`:""}</div>
    <div class="pl">${esc(r.places.slice(0,5).join(" · "))}${r.places.length>5?` 외 ${r.places.length-5}곳`:""}${r.icons.length>1?`<span class="w">같은 뜻인데 아이콘이 ${r.icons.length}가지: ${esc(r.icons.join(", "))}</span>`:""}${others.length?`<span class="w">같은 아이콘을 쓰는 다른 뜻: ${esc(others.slice(0,6).join(", "))}${others.length>6?` 외 ${others.length-6}`:""}</span>`:""}</div>
    <div class="pick">${changed?`<span class="ic new">${iconHtml(r,"new")}</span><span>바꿈<br><code>${d.svg?"올린 파일":esc(d.pick)}</code></span>`:`<span>지금 그대로<br><code>${esc(r.icons[0])}</code></span>`}</div>
    <div class="acts"><button class="btn" data-a="pick">고르기</button>${r.labels.length>1?'<button class="btn" data-a="split">나누기</button>':""}<button class="btn" data-a="name">이름</button><button class="btn" data-a="req">${d.req?"요청 고치기":"생성 요청"}</button><button class="btn" data-a="up">올리기</button>${changed||d.req?'<button class="btn" data-a="undo">되돌리기</button>':""}</div>
    ${d.req?`<div class="req"><b>생성·편집 요청</b>${d.base?` (바탕: ${esc(d.base)})`:""}\n${esc(d.req)}</div>`:""}</div>`});
  $("#main").innerHTML=h||'<div class="hint" style="padding:40px 0">맞는 줄이 없어요.</div>'}
function setDec(r,patch){const targets=$("#link").checked?rows.filter(x=>x.mean===r.mean):[r];targets.forEach(x=>{const k=key(x);DEC[k]=Object.assign({},DEC[k]||{},patch);Object.keys(DEC[k]).forEach(f=>{if(DEC[k][f]==null||DEC[k][f]==="")delete DEC[k][f]});if(!Object.keys(DEC[k]).length)delete DEC[k]});save();render();return targets.length}
function openPick(r){const dlg=$("#dlg");const dm=dupMap();const names=Object.keys(FE).length?Object.keys(FE):Object.keys(APP);let q="";
  const draw=()=>{const qq=q.trim().toLowerCase();const ko=Object.keys(KO).filter(k=>qq&&qq.includes(k)).map(k=>KO[k]).join(" ").split(" ").filter(Boolean);
    const hit=n=>!qq||n.includes(qq)||(TAGS[n]||"").includes(qq)||ko.some(w=>n.includes(w)||(TAGS[n]||"").includes(w));const list=names.filter(hit);const cur=(DEC[key(r)]||{}).pick||r.icons[0];
    dlg.querySelector(".grid").innerHTML=list.map(n=>{const u=dm[r.kind+"|"+n]?[...dm[r.kind+"|"+n]].filter(x=>x!==r.mean):[];return `<button class="cell ${n===cur?"cur":""} ${u.length?"used":""}" data-n="${n}" title="${n}${u.length?` — 이미 쓰는 뜻: ${esc(u.join(", "))}`:""}">${svg(FE[n]||APP[n])}<span>${n}</span>${u.length?`<i>${esc(u[0])}${u.length>1?` 외 ${u.length-1}`:""}</i>`:""}</button>`}).join("")||'<div class="hint">맞는 아이콘이 없어요 — [생성 요청]으로 적어 주세요.</div>';
    dlg.querySelector("#cnt").textContent=list.length+"개";dlg.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{const n=setDec(r,{pick:c.dataset.n,svg:null});dlg.close();toast(`${r.mean} → ${c.dataset.n}${n>1?` (같은 이름 ${n}줄)`:""}`)})};
  dlg.innerHTML=`<div class="dh"><h2>${esc(r.mean)} 아이콘 고르기 <span class="hint" style="font-weight:400">${r.kind} · 지금 ${esc(r.icons.join(", "))}</span></h2><div class="bar"><input class="q" id="pq" placeholder="이름으로 찾기 (예: book, 전화, 달력, 돈)" style="flex:1"><span class="hint" id="cnt"></span><button class="btn" id="pc">닫기</button></div><div class="hint" style="margin-top:6px">노란 칸 = 같은 종류(${r.kind})의 다른 뜻이 이미 쓰는 아이콘이에요. 목록은 feathericons.com 전체예요.</div></div><div class="db"><div class="grid"></div></div>`;
  dlg.showModal();const pq=dlg.querySelector("#pq");pq.oninput=()=>{q=pq.value;draw()};dlg.querySelector("#pc").onclick=()=>dlg.close();draw();pq.focus()}
function openReq(r){const dlg=$("#dlg");const d=DEC[key(r)]||{};
  dlg.innerHTML=`<div class="dh"><h2>${esc(r.mean)} 아이콘 생성·편집 요청</h2><div class="hint">맞는 아이콘이 없을 때 적어 주세요. 예: "home 아이콘 지붕 위에 깃발을 달아 학교처럼". 바탕이 될 아이콘 이름을 적으면 그것을 고쳐서 만들어요.</div></div><div class="db"><div class="hint">바탕 아이콘(없으면 비워 두기)</div><input class="q" id="rb" style="width:100%;margin:4px 0 12px" placeholder="예: home" value="${esc(d.base||d.pick||"")}"><div class="hint">어떻게 만들지</div><textarea id="rt" placeholder="모양·느낌·넣을 것·뺄 것">${esc(d.req||"")}</textarea><div class="bar"><span class="sp"></span><button class="btn" id="rc">취소</button><button class="btn pri" id="ro">요청 적어 두기</button></div></div>`;
  dlg.showModal();dlg.querySelector("#rc").onclick=()=>dlg.close();dlg.querySelector("#ro").onclick=()=>{const t=dlg.querySelector("#rt").value.trim();setDec(r,{req:t||null,base:t?dlg.querySelector("#rb").value.trim()||null:null});dlg.close();toast(t?"요청을 적어 뒀어요":"요청을 지웠어요")};dlg.querySelector("#rt").focus()}
function upload(r){const i=document.createElement("input");i.type="file";i.accept=".svg,image/svg+xml";i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>60000)return toast("파일이 너무 커요(60KB까지)");const rd=new FileReader();rd.onload=()=>{let t=String(rd.result);if(!/<svg[\s>]/i.test(t))return toast("SVG 파일이 아니에요");t=t.replace(/<script[\s\S]*?<\/script>/gi,"").replace(/\son\w+="[^"]*"/gi,"");setDec(r,{svg:t,pick:null});toast(`${r.mean} → 올린 파일`)};rd.readAsText(f)};i.click()}
function openSplit(r){const dlg=$("#dlg");
  dlg.innerHTML=`<div class="dh"><h2>${esc(r.mean)} 나누기 <span class="hint" style="font-weight:400">${r.kind} · ${r.labels.length}개</span></h2><div class="hint">새 줄로 떼어 낼 이름을 고르고, 새 줄의 이름을 적어 주세요. 나눈 줄은 아이콘을 따로 고를 수 있어요.</div></div><div class="db"><div class="labs">${r.labels.map((l,i)=>`<label class="lab"><input type="checkbox" value="${i}"> ${esc(l)}</label>`).join("")}</div><div class="hint" style="margin-top:12px">새 줄 이름</div><input class="q" id="sn" style="width:100%;margin-top:4px" placeholder="예: 메모·비고"><div class="bar"><span class="hint" id="sm"></span><span class="sp"></span><button class="btn" id="sc">취소</button><button class="btn pri" id="so" disabled>나누기</button></div></div>`;
  dlg.showModal();const chk=()=>{const pick=[...dlg.querySelectorAll(".lab input:checked")].map(x=>r.labels[+x.value]);const nm=dlg.querySelector("#sn").value.trim();const dupName=nm&&rows.some(x=>x.kind===r.kind&&x.mean===nm);dlg.querySelector("#so").disabled=!pick.length||pick.length===r.labels.length||!nm||dupName;dlg.querySelector("#sm").textContent=dupName?"같은 이름의 줄이 이미 있어요":pick.length===r.labels.length?"모두 고르면 나눌 것이 없어요":`${pick.length}개를 새 줄로`;return {pick,nm}};
  dlg.querySelectorAll(".lab input").forEach(x=>x.onchange=()=>{const {pick}=chk();const sn=dlg.querySelector("#sn");if(pick.length===1&&!sn.value)sn.value=pick[0];chk()});dlg.querySelector("#sn").oninput=chk;dlg.querySelector("#sc").onclick=()=>dlg.close();dlg.querySelector("#so").onclick=()=>{const {pick,nm}=chk();dlg.close();addOp({t:"split",key:key(r),labels:pick,name:nm});toast(`"${nm}" 줄로 나눴어요`)};chk()}
function openName(r,merge){const dlg=$("#dlg");const ks=merge||null;
  dlg.innerHTML=`<div class="dh"><h2>${ks?`${ks.length}줄 합치기`:"줄 이름 고치기"}</h2><div class="hint">${ks?esc(ks.map(k=>k.split("|")[1]).join(" + ")):esc(r.mean)}</div></div><div class="db"><div class="hint">${ks?"합친 줄의 이름":"새 이름"}</div><input class="q" id="nn" style="width:100%;margin-top:4px" value="${esc(r.mean)}"><div class="bar"><span class="hint" id="nm2"></span><span class="sp"></span><button class="btn" id="nc">취소</button><button class="btn pri" id="no">${ks?"합치기":"고치기"}</button></div></div>`;
  dlg.showModal();const inp=dlg.querySelector("#nn");const chk=()=>{const v=inp.value.trim();const clash=v&&rows.some(x=>x.kind===r.kind&&x.mean===v&&(ks?!ks.includes(key(x)):x!==r));dlg.querySelector("#no").disabled=!v||clash||(!ks&&v===r.mean);dlg.querySelector("#nm2").textContent=clash?"같은 이름의 줄이 이미 있어요":"";return v};inp.oninput=chk;dlg.querySelector("#nc").onclick=()=>dlg.close();
  dlg.querySelector("#no").onclick=()=>{const v=chk();dlg.close();if(ks){const tk=r.kind+"|"+v;const ds=ks.filter(k=>DEC[k]);let m=null;
        /* 합친 줄의 결정 = 먼저 고른 아이콘(올린 파일 우선) + 요청은 모두 이어 붙임(대표가 적은 글을 지우지 않음) */
        if(ds.length){m={};const p=ds.map(k=>DEC[k]).find(d=>d.svg||d.pick);if(p){if(p.svg)m.svg=p.svg;else m.pick=p.pick}const rq=ds.filter(k=>DEC[k].req);if(rq.length)m.req=rq.map(k=>(rq.length>1?k.split("|")[1]+": ":"")+DEC[k].req).join("\n");const b=ds.map(k=>DEC[k]).find(d=>d.base);if(b)m.base=b.base}
        addOp({t:"merge",keys:ks,name:v},null,[...ks,tk]);if(m){ks.forEach(k=>delete DEC[k]);DEC[tk]=m;save();render()}toast(`${ks.length}줄을 "${v}"로 합쳤어요`)}else{addOp({t:"name",key:key(r),name:v},[key(r),r.kind+"|"+v]);toast("이름을 고쳤어요")}};chk();inp.focus();inp.select()}
function exportData(){return {made:new Date().toISOString().slice(0,16),from:DATA.made,groups:OPS.map(({_prev,...o})=>o),rows:rows.map(r=>({kind:r.kind,mean:r.mean,labels:r.labels})),decisions:rows.map(r=>{const d=DEC[key(r)];if(!d)return null;return {kind:r.kind,mean:r.mean,labels:r.labels,places:r.places,current:r.icons,pick:d.pick||null,request:d.req||null,base:d.base||null,svg:d.svg||null}}).filter(Boolean)}}
document.addEventListener("click",e=>{const k=e.target.closest("[data-k]");if(k){fKind=k.dataset.k;return render()}const a=e.target.closest("[data-a]");if(!a)return;const r=rows.find(x=>key(x)===a.closest(".row").dataset.key);if(!r)return;
  if(a.dataset.a==="pick")openPick(r);else if(a.dataset.a==="split")openSplit(r);else if(a.dataset.a==="name")openName(r);else if(a.dataset.a==="req")openReq(r);else if(a.dataset.a==="up")upload(r);else if(a.dataset.a==="undo"){setDec(r,{pick:null,svg:null,req:null,base:null});toast("처음대로 되돌렸어요")}});
document.addEventListener("change",e=>{const c=e.target.closest&&e.target.closest("[data-sel]");if(!c)return;c.checked?SEL.add(c.dataset.sel):SEL.delete(c.dataset.sel);render()});
$("#undoOp").onclick=undoOp;
$("#merge").onclick=()=>{const ks=[...SEL].filter(k=>rows.some(r=>key(r)===k));if(ks.length<2)return;openName(rows.find(r=>key(r)===ks[0]),ks)};
$("#q").oninput=e=>{Q=e.target.value.trim().toLowerCase();render()};$("#fDup").onclick=()=>{fDup=!fDup;render()};$("#fTodo").onclick=()=>{fTodo=!fTodo;render()};
$("#reset").onclick=()=>{if(confirm("고른 것·요청·올린 파일과 나누고 합친 것을 모두 지우고 처음으로 돌릴까요?")){DEC={};save();OPS=[];saveOps();rows=buildRows();SEL.clear();render()}};
$("#copy").onclick=()=>{const t=JSON.stringify(exportData(),null,1);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("결정을 복사했어요 — 작업 창에 붙여 주세요"),()=>toast("복사하지 못했어요 — [결정 내보내기]를 써 주세요"))};
$("#exp").onclick=()=>{const d=exportData();if(!d.decisions.length&&!d.groups.length)return toast("아직 정하거나 고친 것이 없어요");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:"application/json"}));a.download="icon-decisions.json";a.click();toast(`결정 ${d.decisions.length}건 · 묶음 ${d.groups.length}건을 icon-decisions.json 으로 받았어요`)};
render();
