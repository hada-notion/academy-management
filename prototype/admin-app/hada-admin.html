<script>
"use strict";

// 설명 문구는 화면에 늘어놓지 않고 제목 옆 (?)에 둔다(261112 대표). 올리거나 누르면 보임
// 날짜 칸은 달력 아이콘 없이, 칸 어디를 눌러도 달력이 열린다
const dDot=v=>v?v.replace(/-/g,"."):"";
// 날짜 칸(261112 대표): 직접 입력("2026.11.11"·"20261111"·"11.11") + 누르면 작은 달력. 값은 숨은 칸(.dnat)에 두고 change를 보내 예전 코드 그대로 씀
const dShow=v=>!v?"":v.slice(0,10).replace(/-/g,".")+(v.length>10?" "+v.slice(11,16):"");
function DATE(id,v,attrs=""){return dateBox(`id="${id}" ${attrs}`,v||"",false)}
function dateBox(attr,v,time,ph){const dis=/\bdisabled\b/.test(attr);return `<span class="dwrap"><input class="inp dtxt" value="${dShow(v)}" placeholder="${ph||(time?"YYYY.MM.DD HH:mm":"YYYY.MM.DD")}" ${dis?"disabled":""} autocomplete="off" inputmode="numeric"><input type="hidden" class="dnat" data-t="${time?1:""}" ${attr} value="${v||""}"></span>`}
function dParse(t,time,base){t=(t||"").trim();if(!t)return "";const y0=(base||TODAY).slice(0,4);let m=t.replace(/\s+/g," ").match(/^(\d{4})[.\-/ ]*(\d{1,2})[.\-/ ]*(\d{1,2})\.?(?:\s+(\d{1,2})[:시]?(\d{2})?)?$/)||t.match(/^(\d{4})(\d{2})(\d{2})(?:\s*(\d{2}):?(\d{2}))?$/);
  if(!m){const k=t.match(/^(\d{1,2})[.\-/ ]+(\d{1,2})\.?(?:\s+(\d{1,2}):?(\d{2})?)?$/);if(k)m=[0,y0,k[1],k[2],k[3],k[4]]}if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3];const dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1||dt.getDate()!==d)return null;let out=`${y}-${pad2(mo)}-${pad2(d)}`;
  if(time){const hh=m[4]!=null?+m[4]:12,mm=m[5]!=null?+m[5]:0;if(hh>23||mm>59)return null;out+=`T${pad2(hh)}:${pad2(mm)}`}return out}
let dPop=null;function dClose(){if(dPop){dPop.remove();dPop=null}}
function dCommit(tx,val){const h=tx.nextElementSibling;const mn=h.getAttribute("min"),mx=h.getAttribute("max");if(val&&mn&&val.slice(0,10)<mn){toast(`${dShow(mn)}부터 고를 수 있어요`);tx.value=dShow(h.value);return}if(val&&mx&&val.slice(0,10)>mx){toast(`${dShow(mx)}까지 고를 수 있어요`);tx.value=dShow(h.value);return}
  tx.value=dShow(val);if(h.value===val)return;h.value=val;h.dispatchEvent(new Event("input",{bubbles:true}));h.dispatchEvent(new Event("change",{bubbles:true}))}
function dOpen(tx){dClose();const h=tx.nextElementSibling;const time=!!h.dataset.t;const cur=h.value||"";let ym=(dParse(tx.value,time)||cur||TODAY).slice(0,7);const mn=h.getAttribute("min"),mx=h.getAttribute("max");
  const pop=document.createElement("div");pop.className="dpop";document.body.appendChild(pop);dPop=pop;pop._tx=tx;
  const draw=()=>{const [y,m]=ym.split("-").map(Number);const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate();const lead=(first.getDay()+6)%7;const sel=(dParse(tx.value,time)||cur).slice(0,10);
    let h2=`<div class="dph"><button type="button" data-dm="-1">${IC("left","s")}</button><b>${y}년 ${m}월</b><button type="button" data-dm="1">${IC("rightc","s")}</button></div><div class="dpg">${["월","화","수","목","금","토","일"].map(x=>`<i>${x}</i>`).join("")}`;
    for(let i=0;i<lead;i++)h2+="<span></span>";for(let d=1;d<=days;d++){const v=`${y}-${pad2(m)}-${pad2(d)}`;const off=(mn&&v<mn)||(mx&&v>mx);h2+=`<button type="button" class="${v===sel?"on":""} ${v===TODAY?"td":""}" data-dd="${v}" ${off?"disabled":""}>${d}</button>`}
    pop.innerHTML=h2+`</div><div class="dpf"><button type="button" data-dd="${TODAY}">오늘</button><span class="hint">직접 입력: 2026.11.11${time?" 14:30":""}</span></div>`;
    pop.querySelectorAll("[data-dm]").forEach(b=>b.onmousedown=e=>{e.preventDefault();const [yy,mm]=ym.split("-").map(Number);const n=new Date(yy,mm-1+(+b.dataset.dm),1);ym=`${n.getFullYear()}-${pad2(n.getMonth()+1)}`;draw()});
    pop.querySelectorAll("[data-dd]").forEach(b=>b.onmousedown=e=>{e.preventDefault();let v=b.dataset.dd;if(time){const old=dParse(tx.value,true)||cur;v+=old&&old.length>10?old.slice(10):"T"+(nowStamp().slice(11))}dCommit(tx,v);dClose();tx.blur()})};
  draw();const r=tx.getBoundingClientRect();const pw=260;pop.style.left=Math.max(8,Math.min(innerWidth-pw-8,r.left))+"px";/* 163판: 칸 왼쪽에 맞춤(가운데 맞춤은 좁은 칸에서 창 밖으로 나갔음) */const ah=pop.offsetHeight||300;const below=r.bottom+6+ah<=innerHeight-8;pop.style.top=(below?r.bottom+6:Math.max(8,r.top-6-ah))+"px"}
document.addEventListener("focusin",e=>{const tx=e.target;if(tx.classList&&tx.classList.contains("dtxt")&&!tx.disabled){dOpen(tx);setTimeout(()=>{try{tx.select()}catch(_){}},0)}});
document.addEventListener("focusout",e=>{const tx=e.target;if(!(tx.classList&&tx.classList.contains("dtxt")))return;setTimeout(()=>{if(document.activeElement===tx)return;if(!tx.isConnected){if(dPop&&dPop._tx===tx)dClose();return}const h=tx.nextElementSibling;const v=dParse(tx.value,!!h.dataset.t);if(v===null){toast("날짜를 2026.11.11 처럼 입력해 주세요");tx.value=dShow(h.value)}else dCommit(tx,v);if(dPop&&dPop._tx===tx)dClose()},0)});
document.addEventListener("keydown",e=>{const tx=e.target;if(!(tx.classList&&tx.classList.contains("dtxt")))return;if(e.key==="Enter"){e.preventDefault();tx.blur()}else if(e.key==="Escape"){e.stopPropagation();tx.value=dShow(tx.nextElementSibling.value);dClose();tx.blur()}},true);
document.addEventListener("input",e=>{const tx=e.target;if(tx.classList&&tx.classList.contains("dtxt")&&dPop){const v=dParse(tx.value,!!tx.nextElementSibling.dataset.t);if(v){dOpen(tx)}}});
addEventListener("scroll",e=>{if(dPop&&!(e.target&&e.target.closest&&e.target.closest(".dpop")))dClose()},true);
// (?) 도움말: 화면 밖으로 안 나가게 떠 있는 말풍선
document.addEventListener("mouseover",e=>{const q=e.target.closest&&e.target.closest(".qhelp");if(q)showTip(q)});
document.addEventListener("mouseout",e=>{const q=e.target.closest&&e.target.closest(".qhelp");if(q&&!q.contains(e.relatedTarget))hideTip()});
document.addEventListener("focusin",e=>{if(e.target.classList&&e.target.classList.contains("qhelp"))showTip(e.target)});
document.addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("qhelp"))hideTip()});
function showTip(q){hideTip();const t=document.createElement("div");t.id="qtip";t.textContent=q.dataset.help;document.body.appendChild(t);const r=q.getBoundingClientRect(),w=t.offsetWidth,h=t.offsetHeight;let x=Math.max(8,Math.min(r.left-8,innerWidth-w-8)),y=r.bottom+6;if(y+h>innerHeight-8)y=r.top-h-6;t.style.left=x+"px";t.style.top=y+"px"}
function hideTip(){const t=document.getElementById("qtip");if(t)t.remove()}
function HELP(t){return `<span class="qhelp" tabindex="0" role="note" aria-label="${esc(t)}" data-help="${esc(t)}">${IC("help")}</span>`}
/* ================= 데이터 (가짜 학원) ================= */
const DAYS=["월","화","수","목","금","토","일"];
const uid=(p)=>p+Math.random().toString(36).slice(2,8);
const rnd=(()=>{let s=261111;return()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648}})();
const pick=a=>a[Math.floor(rnd()*a.length)];
const XCOL=["progress","events","reports","tuition","bookfees","letters","schools","tests"/* 261123 시험(학원) 줄 — exams.js */,"exams","costs","alims","recs","anotes","grades","series","glevels","charges","areas","etcs","files","routines"/* 261119 대표: 클래스 루틴 */];/* 185판: 표 부품만으로 생성한 화면들의 자료 */
const DB={seasons:[],teachers:[],classes:[],students:[],enrolls:[],blocks:[],subjects:[],books:[]};XCOL.forEach(k=>DB[k]=[]);
function seed(){
  DB.seasons=[{id:"s1",name:"2026 2학기",start:"2026-09-01",end:"2026-12-19",state:"확정"},{id:"s2",name:"2026 겨울방학",start:"2026-12-20",end:"2027-02-28",state:"초안"}];
  DB.teachers=[["t1","김하다","원장","월,화,수,목,금"],["t2","이하다","강사","월,수,금"],["t3","박하다","강사","화,목,토"],["t4","최하다","강사","월,화,수,목,금"],["t5","정하다","조교","화,목"]].map(([id,name,role,days],i)=>({id,name,role,phone:"010-0000-00"+(10+i),days}));
  const C=[["c1","중1 수학","수학","t2",250000],["c2","중2 수학A","수학","t2",300000],["c3","중2 영어B","영어","t1",250000],["c4","중3 영어","영어","t1",250000],["c5","고1 수학","수학","t4",320000],["c6","고1 수학 1:1","수학","t4",400000],["c7","고2 국어","국어","t3",280000],["c8","중등 과학","과학","t3",230000],["c9","초등 영어","영어","t5",200000],["c10","겨울 문법 특강","영어","t1",150000]];
  const SH={c1:"중1수",c2:"중2수A",c3:"중2영B",c5:"고1수",c6:"고1수1:1",c9:"초영"};
  DB.classes=C.map(([id,name,subject,teacherId,fee],i)=>({id,name,short:SH[id]||"",subject,teacherId,fee,qty:8/* 261118: 예시 = 한 달 8회(노션 월간 수업 총량 — 비면 수강료 생성 안 함) */,unit:"횟수",kind:id==="c10"?"특강":"정규",open:id==="c10"?"2026-12-22":id==="c8"?"2026-11-25":"",close:id==="c4"?"2026-12-19":(id==="c10"?"2027-01-10":""),color:i%8+1}));
  DB.classes.push({id:"c11",name:"2025 여름 문법 특강",short:"",subject:"영어",teacherId:"t1",fee:150000,qty:"",unit:"횟수",kind:"특강",open:"2025-07-21",close:"2025-08-22",color:4},{id:"c12",name:"2025 1학기 중3 수학",short:"",subject:"수학",teacherId:"t2",fee:300000,qty:"",unit:"횟수",kind:"정규",open:"2025-03-03",close:"2025-07-18",color:2});
  const sur="김이박최정강조윤장임한오서신권황안송류홍",giv=["민준","서연","도윤","하은","지호","서윤","예준","지우","시우","하린","주원","수아","건우","지안","우진","윤서","선우","채원","현우","다은","유준","소율","은우","예린"];
  const schools=[["하다중","중"],["푸른중","중"],["하다고","고"],["바다초","초"]];
  for(let i=0;i<60;i++){const [sc,lv]=pick(schools);const g=lv+(1+Math.floor(rnd()*(lv==="초"?6:3)));DB.students.push({id:"st"+i,name:sur[Math.floor(rnd()*sur.length)]+pick(giv),school:sc,grade:i===7?"":g,status:i>=54?"대기":"재원",mom:i%5?"010-0000-1"+String(100+i):"",dad:i%5?"":"010-0000-2"+String(100+i)})}
  DB.students.push({id:"st60",name:"김민준",school:"하다중",grade:"중2",status:"재원",mom:"010-0000-1300",dad:""});
  DB.students.push({id:"st61",name:"김민준",school:"푸른중",grade:"중3",status:"재원",mom:"010-0000-1301",dad:""});
  const B=[["c1",[0,2],16*60,17*60],["c2",[0,2,4],16*60,18*60],["c3",[1,3],18*60,19*60+30],["c4",[1,3],19*60,20*60+30],["c5",[0,2,4],19*60,21*60],["c7",[1,3],17*60,18*60+30],["c8",[5],10*60,11*60+30],["c9",[0,2],14*60+30,15*60+30],["c9",[4],14*60+30,15*60+30]];
  B.forEach(([cid,days,s,e])=>days.forEach(d=>DB.blocks.push({id:uid("b"),seasonId:"s1",classId:cid,day:d,start:s,end:e,regs:[],mode:"group",state:"saved",lessons:true})));
  // 수강: 재원 학생을 클래스에 배정
  const groupCls=["c1","c2","c3","c4","c5","c7","c8","c9"];
  DB.students.forEach((st,i)=>{if(st.status!=="재원"||i>=50)return;const cid=groupCls[i%groupCls.length];addEnroll(st.id,cid,true,"saved");if(i%4===0){const c2=groupCls[(i+3)%groupCls.length];if(c2!==cid)addEnroll(st.id,c2,true,"saved")}});
  // 원본 구조(261112): 우선 연락 대상, 등록 전·종료·보류 예시
  DB.students.forEach(x=>{x.pre=x.mom?"어머니":"아버지";x.hold=false;x.memo="";delete x.status});
  const en1=addEnroll("st52","c3",false,"saved");en1.start="2026-11-16";
  DB.students[53].hold=true;
  [["st56","c1"],["st57","c4"]].forEach(([sid,cid])=>{const e=addEnroll(sid,cid,false,"saved");e.start="2026-03-02";e.end="2026-08-29";e.ended=true});
  DB.students.forEach((x,i)=>{const es=DB.enrolls.filter(e=>e.studentId===x.id).map(e=>e.start).filter(Boolean).sort();x.inq=(es.length?dPlus(es[0],-(3+i%20)):dPlus(TODAY,-(i%14)))+"T"+pad2(13+i%8)+":"+(i%2?"30":"00")});
  // 일부 요일만: 몇 명은 금요일 블록에서 뺌
  DB.blocks.filter(b=>b.classId==="c2"&&b.day===4).forEach(b=>{b.regs=b.regs.slice(2)});
  // 1:1: 학생 2명 개별 블록
  [["st3",1,17*60,18*60],["st11",5,13*60,14*60]].forEach(([sid,d,s,e])=>{const en=addEnroll(sid,"c6",false,"saved");DB.blocks.push({id:uid("b"),seasonId:"s1",classId:"c6",day:d,start:s,end:e,regs:[en.id],mode:"individual",state:"saved",lessons:true})});
  // 시간표 없는 수강 하나
  addEnroll("st50","c2",false,"saved");

function snapRegs(b){if(!b.regs0)b.regs0=[...b.regs]}
// 165판: 저장된 명단 = 마지막으로 저장한 시간표(TSAVED)에서 읽음. regs0은 되돌리기(Ctrl+Z) 뒤 어긋날 수 있었음(사용성 시험: 저장 창이 남은 학생을 모두 "넣기"로 보여 줌)
function savedRegs(b){const sv=typeof TSAVED!=="undefined"&&TSAVED.get(b.id);if(sv){try{return JSON.parse(sv).regs||[]}catch(_){}}return b.regs0||b.regs}
// 운영 중 블록의 요일·시간은 바로 나누지 않고 기억했다가 저장 때 "언제부터" 한 번(261112 대표)
function stageTime(b,nv,all){const old={day:b.day,start:b.start,end:b.end};if(!b.t0)b.t0={...old};Object.assign(b,nv);
  if(blockConflicts(b,all)){Object.assign(b,old);if(b.t0.day===b.day&&b.t0.start===b.start&&b.t0.end===b.end)delete b.t0;render();toast("같은 클래스가 같은 요일 겹치는 시간에 둘 수 없어요");return false}
  if(b.t0.day===b.day&&b.t0.start===b.start&&b.t0.end===b.end)delete b.t0;b.state="draft";commit();if(b.t0)toast("작성 중 — 같은 클래스 다른 요일도 고친 뒤 저장할 때 언제부터 물어요");return true}
// 예시 데이터를 생성할 때 쌓인 기억은 지운다(화면을 연 뒤 바꾼 것만 "언제부터" 대상)
window.addEventListener("load",()=>{DB.blocks.forEach(b=>delete b.regs0)});
function addEnroll(studentId,classId,attachGroup,state){
  let en=DB.enrolls.find(e=>e.studentId===studentId&&e.classId===classId&&!e.ended);
  if(!en){en={id:uid("e"),studentId,classId,start:"2026-09-01",discount:0,state:state||"draft"};DB.enrolls.push(en)}
  if(attachGroup)DB.blocks.filter(b=>b.classId===classId&&b.mode==="group"&&b.seasonId===curSeason()).forEach(b=>{if(!b.regs.includes(en.id)){snapRegs(b);b.regs.push(en.id)}});
  return en;
  return en;
}
/* ================= 앱 상태 ================= */

const ZOOM=[[40,60],[60,30],[90,20],[120,15],[160,10],[240,5]];

function laneLayout(list){ // 같은 요일 겹치는 블록 나란히
  const res=new Map();for(let d=0;d<7;d++){const day=list.filter(b=>b.day===d).sort((a,b)=>a.start-b.start||a.end-b.end);let groups=[],cur=[],curEnd=-1;
    day.forEach(b=>{if(b.start>=curEnd&&cur.length){groups.push(cur);cur=[]}cur.push(b);curEnd=Math.max(curEnd,b.end)});if(cur.length)groups.push(cur);
    groups.forEach(g=>{const lanes=[];g.forEach(b=>{let i=lanes.findIndex(end=>end<=b.start);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=b.end;res.set(b.id,{i,n:0})});g.forEach(b=>res.get(b.id).n=lanes.length)})}
  return res}

/* 적용 기간(261112 대표): 기본 = 시즌 기간을 클래스 기간(개강-종강)으로 좁힌 것. 시간표에서 직접 고칠 수 있고(직접 정함), 그 범위 밖으로는 못 나감 */
/* 261119 대표 "진짜 오늘 날짜로": 예시 자료 기준일 = 이 컴퓨터의 오늘(한국 시각, toISOString 같은 UTC 안 씀). 주소에 ?today=YYYY-MM-DD를 붙이면 그날로 고정(검사 · 캡처 재현용). 예시 자료는 거의 TODAY 기준이라 날마다 같이 움직임. 실제 자료 모드(live.js)도 오늘 날짜 */
let TODAY=(()=>{try{const q=new URLSearchParams(location.search).get("today");if(q&&/^\d{4}-\d{2}-\d{2}$/.test(q))return q}catch(_){}const n=new Date(),p=v=>String(v).padStart(2,"0");return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`})();
const pad2=n=>String(n).padStart(2,"0");
function dPlus(d,n){const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return `${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`}
function dow(d){return (new Date(d+"T12:00:00").getDay()+6)%7} // 0=월
/* 날짜 표기(261113 대표): 모두 YYYY.MM.DD, 시각 있으면 YYYY.MM.DD HH:mm */
const md=d=>d?d.slice(0,10).replace(/-/g,"."):"";
function defPeriod(b){const s=seasonOf(b.seasonId),c=b.classId?cls(b.classId):null;let f=s.start,t=s.end;if(c&&c.open&&c.open>f)f=c.open;if(c&&c.close&&c.close<t)t=c.close;return{from:f,to:t}}
function effPeriod(b){const d=defPeriod(b);let f=b.from||d.from,t=b.to||d.to;if(b.ended&&TODAY<t)t=TODAY;return{from:f,to:t}}
const isCustom=b=>!!(b.from||b.to);
function perOverlap(a,b){return a.from<=b.to&&b.from<=a.to}
// 165판: 시즌을 바꿨는데 보는 주가 그 시즌 밖이면 시즌 첫 주로(오늘이 시즌 안이면 이번 주). 사용성 시험: 겨울 시즌으로 바꾸면 빈 주가 보였음
function seaWeek(st){const s=seasonOf(st.season);if(!s||!s.start)return;const w=weekOf(st);if(w.to>=s.start&&w.from<=s.end)return;const base=TODAY>=s.start&&TODAY<=s.end?TODAY:s.start;st.week=dPlus(base,-dow(base));toast(`${s.name} 주로 옮겼어요 — ${md(st.week)} 주`)}
function weekOf(st){if(!st.week){st.week=dPlus(TODAY,-dow(TODAY))}return{from:st.week,to:dPlus(st.week,6)}}
function blockConflicts(b,all){return all.some(x=>x!==b&&x.id!==b.id&&!x.ended&&x.classId===b.classId&&x.day===b.day&&x.start<b.end&&b.start<x.end&&perOverlap(effPeriod(x),effPeriod(b)))}
function studentOverlaps(all){const out=[];const byStu={};all.forEach(b=>b.regs.forEach(r=>{const e=enr(r);if(!e)return;(byStu[e.studentId]=byStu[e.studentId]||[]).push(b)}));
  for(const [sid,bs] of Object.entries(byStu)){for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){const a=bs[i],c=bs[j];if(a.day===c.day&&a.start<c.end&&c.start<a.end)out.push([sid,a,c])}}return out}

function recUnits(r){const pg=r.bookId&&DB.progress.find(x=>x.id===r.bookId),bk=pg&&DB.books.find(b=>b.id===pg.bookId);if(!bk||!(bk.units||[]).length||!r.range)return [];const spans=[...String(r.range).matchAll(/(\d+)(?:\s*[-~–]\s*(\d+))?/g)].map(m=>[+m[1],+(m[2]||m[1])]);if(!spans.length)return [];return unitFix(bk).filter(u=>u.from!=null&&spans.some(([a,z])=>u.from<=z&&(u.to==null?u.from:u.to)>=a)).map(u=>u.name)}
const recsOf=k=>(DB.recs||[]).filter(r=>r.key===k&&!r.del);const RK={학습:"edit2",과제:"clip",평가:"filetext"};const HWL={"완료":"제출","일부 완료":"일부 제출","미제출":"미제출"};const EKIND=["일일","주간","월간","단원","마무리","기타"];

/* 보강 ↔ 기존 결석 1:1(원본 출석 `보강 출석`·`기존 결석`, 매뉴얼 6-7-4·6-7-5) — 보강 수업 안내 알림톡의 "기존 결석" 줄이 여기서 나옴
   DB.mkw[결석 키] = {dec: 없음(판단 전)|"need"|"none", why, mk: 보강 id}. (261113 대표)
   결석 상태: 판단 전 → 보강 필요 → 보강 잡힘(보강에 넣음) → 보강 완료(그 보강에 출석하면 보강 대기에서 사라짐). 보강도 결석이면 "보강도 결석"으로 다시 넣을 차례.
   학생을 보강에 넣으면 그 학생의 가장 오래된 보강 필요 결석과 이어짐(보강 날 이전, 클래스 보강이면 그 클래스). 빼거나 보강 삭제·휴강이면 연결이 풀림. */
const seaStart=()=>{const se=seasonOf(curSeason());return se&&se.start?se.start:dPlus(TODAY,-28)};
function absAll(from){from=from||seaStart();const out=[];const S=curSeason();DB.blocks.filter(b=>b.seasonId===S).forEach(b=>{for(let d=TODAY;d>=from;d=dPlus(d,-1)){if(dow(d)!==b.day||!lessonMade(b,d)||lessonEff(b,d).off)continue;
  lessonRoster(b,d).forEach(x=>{if(attOf(b,d,x.id)==="결석")out.push({k:lkey(b,d)+"|"+x.id,sid:x.id,classId:b.classId,d})})}});return out}
const absInfo=k=>{const [bid,d,sid]=k.split("|");const b=byId(DB.blocks,bid);return {k,sid,d,classId:b?b.classId:null}};
function mkSrc(m,sid){const k=Object.keys(DB.mkw).find(k=>DB.mkw[k].mk===m.id&&k.endsWith("|"+sid));return k?absInfo(k):null}
const absMk=k=>{const w=DB.mkw[k]||{};return w.mk&&w.mk!=="예시"?DB.mk.find(z=>z.id===w.mk)||null:null};
// pre 판단 전 · need 보강 필요 · pend 보강 잡힘 · re 보강도 결석 · none 보강 없음 · done 보강 완료
function absState(k){const w=DB.mkw[k]||{};if(w.mk==="예시")return "done";const m=absMk(k);if(m){const a=m.att[k.split("|").pop()];if(a==="출석")return "done";if(a!=="결석")return "pend";return "re"}if(w.dec==="none")return "none";return w.dec==="need"?"need":"pre"}
const absOpen=k=>{const s2=absState(k);return s2==="need"||s2==="re"||s2==="pre"}; // 보강에 넣을 수 있는 결석
const absFits=(a,m)=>a.d<=m.d&&(!m.classId||a.classId===m.classId);
const absPick=(sid,m,kc)=>absAll().filter(a=>a.sid===sid&&absFits(a,m)&&(!kc||a.classId===kc)&&absOpen(a.k)).sort((a,b)=>a.d.localeCompare(b.d))[0]||null;
function mkLink(){const live=new Map(DB.mk.filter(m=>!m.off).map(m=>[m.id,m]));
  Object.entries(DB.mkw).forEach(([k,w])=>{if(!w.mk||w.mk==="예시")return;const m=live.get(w.mk);if(!m||!m.sids.includes(k.split("|").pop())){const n=Object.assign({},w);delete n.mk;DB.mkw[k]=n}});
  [...live.values()].sort((a,b)=>a.d.localeCompare(b.d)||a.start-b.start).forEach(m=>m.sids.forEach(sid=>{if(m.att[sid]==="결석"||mkSrc(m,sid))return;
    const c=absPick(sid,m);if(c)DB.mkw[c.k]=Object.assign({},DB.mkw[c.k],{dec:"need",mk:m.id})}))}
function mkWait(){seedOffOnce();seedMkw();mkLink();return absAll().map(a=>Object.assign(a,{st:absState(a.k)})).filter(a=>a.st!=="none"&&a.st!=="done").map(a=>Object.assign(a,{dec:a.st==="pre"?null:"need"}))
  .sort((a,b)=>b.d.localeCompare(a.d)||a.sid.localeCompare(b.sid))}
const mkWaitN=()=>new Set(mkWait().map(w=>w.sid)).size; // 보강 대기 학생 수
// 163판: 수업 할 일 숫자 한 기준(사용성 시험: 단추 18·메뉴 16·탭 14가 서로 달랐음) = 미입력 수업 + 수업 없음 + 보강 카드(학생+클래스, 판단 전 제외)
const mkCardN=()=>new Set(mkWait().filter(w=>w.st!=="pend").map(w=>w.sid+"|"+w.classId)).size;
function lessonTodoNow(){const S=curSeason(),wk={from:dPlus(TODAY,-dow(TODAY))};const its=DB.blocks.filter(b=>b.seasonId===S&&b.day<7).map(b=>({b,d:lessonDate(b,wk)})).filter(x=>{const p=effPeriod(x.b);return x.d>=p.from&&x.d<=p.to&&!closedOn(x.b,x.d)});
  return {un:its.filter(x=>lessonMade(x.b,x.d)&&x.d<=TODAY&&!lessonEff(x.b,x.d).off&&attSum(x.b,x.d).미입력>0).length,ms:its.filter(x=>!lessonMade(x.b,x.d)).length,mk:mkCardN()}}
// 보강 없음으로 정리한 결석(지난 4주만 — 보강 대기와 같은 기간이라 많아지지 않음)
function mkNone(){mkWait();const out=[];const S=curSeason();DB.blocks.filter(b=>b.seasonId===S).forEach(b=>{for(let i=0;i<=28;i++){const d=dPlus(TODAY,-i);if(dow(d)!==b.day||!lessonMade(b,d))continue;
  lessonRoster(b,d).forEach(x=>{const k=lkey(b,d)+"|"+x.id;const w=DB.mkw[k];if(w&&w.dec==="none"&&attOf(b,d,x.id)==="결석")out.push({k,sid:x.id,classId:b.classId,d,why:w.why||""})})}});return out.sort((a,b)=>b.d.localeCompare(a.d))}
// 예시 데이터: 10일보다 오래된 결석은 이미 보강을 마친 것으로(시제품 화면이 너무 길지 않게)
let mkwSeeded=false;function seedMkw(){if(mkwSeeded)return;mkwSeeded=true;const lim=dPlus(TODAY,-10);DB.blocks.forEach(b=>{for(let d=dPlus(TODAY,-11);d>=seaStart();d=dPlus(d,-1)){if(dow(d)!==b.day||!lessonMade(b,d))continue;lessonRoster(b,d).forEach(x=>{if(attOf(b,d,x.id)==="결석"){const k=lkey(b,d)+"|"+x.id;if(!DB.mkw[k])DB.mkw[k]={mk:"예시"}}})}})}
const dAgo=d=>Math.round((new Date(TODAY+"T12:00:00")-new Date(d+"T12:00:00"))/864e5);

// 최근 휴강한 클래스(앞뒤 4주, 최근 것 먼저)
function recentOff(upto){const out=new Map();DB.blocks.forEach(b=>{for(let i=-7;i<=28;i++){const d=dPlus(upto,-i);const o=DB.lov[lkey(b,d)];if(o&&o.off&&!out.has(b.classId))out.set(b.classId,{c:cls(b.classId),d,sids:studentsOfBlock(b).map(x=>x.id)})}});return [...out.values()].filter(x=>x.c).sort((a,b)=>b.d.localeCompare(a.d))}

function recentAbsAll(upto){const out=new Map();DB.classes.forEach(c=>recentAbsent(c.id,upto).forEach((d,sid)=>{const o=out.get(sid);if(!o||d>o.d)out.set(sid,{d,classId:c.id})}));return new Map([...out].sort((a,b)=>b[1].d.localeCompare(a[1].d)))}
// 보강 학생 고르기(새 보강·보강 편집 같음)
// 보강 학생 고르기(261112 대표): 시간표 [클래스] 고르기와 같은 틀 — 검색 칸 + 한 목록 안 묶음(선택된 학생 → 최근 결석 → 최근 휴강 클래스별) + 아래 "다른 학생 검색"
function mkPicker(w,upto,seasonId){
  const offs=recentOff(upto),abs=recentAbsAll(upto),c=w.classId?cls(w.classId):null;
  const bz=w.start!=null?busyAt(w.d||upto,w.start,w.end,w.id?"mk:"+w.id:null).st:new Map();
  const allow=c?new Set(DB.enrolls.filter(e=>e.classId===c.id&&!e.ended).map(e=>e.studentId)):null;const ok=id=>{const x=stu(id);return !!x&&!x.del&&(!allow||allow.has(id))};
  const wt=new Map(),wl=new Map();mkWait().forEach(x=>{if(!wt.has(x.sid))wt.set(x.sid,x);(wl.get(x.sid)||wl.set(x.sid,[]).get(x.sid)).push(x)});
  /* 261119 대표: 학생 목록엔 그 학생의 모든 클래스가 아니라 보강이 필요한 클래스 · 결석한 날 하나(가장 오래된 것) + 더 있으면 +n */
  const abList=id=>{const L=(wl.get(id)||[]).slice().sort((p1,p2)=>String(p1.d).localeCompare(String(p2.d)));return L.length?L:(abs.get(id)?[abs.get(id)]:[])};
  const absTag=id=>{const L=abList(id);if(!L.length)return "";const a=L[0];return `${(cls(a.classId)||{}).name} ${md(a.d).slice(5)} 결석${L.length>1?` +${L.length-1}`:""}`};
  // 목록 묶음(비었을 때): 보강 대기 → 최근 결석 학생 → 최근 휴강 클래스별([모두 넣기]) → 그 클래스 학생
  w._hp={c,allow,groups:()=>[{title:"보강 대기",ids:[...wt.keys()].filter(ok)},{title:"최근 결석 학생 <small>4주</small>",ids:[...abs.keys()].filter(ok)},
      ...offs.map(o2=>({title:`최근 휴강 · ${esc(o2.c.name)} <small>${md(o2.d)}</small>`,ids:o2.sids.filter(ok),act:true})),...(c?[{title:`${esc(c.name)} 학생`,ids:[...allow].filter(ok)}]:[])],
    info:id=>({note:abList(id).length?absTag(id):undefined,abs:abList(id).length>0,warn:bz.has(id)?`${esc(bz.get(id))} 수업`:""})};

function bindMkPicker(p,w,after){const h=w._hp;if(!h)return;
  hpStu(p.querySelector("#hpMS"),{students:hpStudents().filter(x=>!h.allow||h.allow.has(x.id)),value:w.sids,groups:h.groups,info:h.info,stackGroup:x=>(x.cls||"").split(" · ")[0],searchTitle:"보강 학생 검색",

function lessonsOn(date){const out=[];const inS=b=>{const se=seasonOf(b.seasonId);return se&&se.state==="확정"&&!b.del&&inPer(effPeriod(b),date)};
  DB.blocks.filter(b=>b.day===dow(date)&&inS(b)).forEach(b=>{const e=lessonEff(b,date);if(!e.moved&&!e.off)out.push({k:lkey(b,date),name:(cls(b.classId)||{}).name,tch:(cls(b.classId)||{}).teacherId,sids:studentsOfBlock(b).map(x=>x.id),start:e.start,end:e.end})});
  Object.entries(DB.lov).forEach(([k,o])=>{if(o.d!==date||o.off)return;const [bid,od]=k.split("|");const b=byId(DB.blocks,bid);if(!b)return;if(o.d===od&&o.start===b.start&&o.end===b.end)return;out.push({k,name:(cls(b.classId)||{}).name,tch:(cls(b.classId)||{}).teacherId,sids:studentsOfBlock(b).map(x=>x.id),start:o.start,end:o.end})});
  DB.mk.filter(m=>m.d===date&&!m.off).forEach(m=>out.push({k:"mk:"+m.id,name:mkName(m),tch:m.classId?(cls(m.classId)||{}).teacherId:null,sids:m.sids,start:m.start,end:m.end}));return out}

function clashToast(date,start,end,sids,tchId,selfKey,prefix){const bz=busyAt(date,start,end,selfKey);const hit=sids.filter(id=>bz.st.has(id));const tb=null; // 강사 겹침은 알리지 않음(같은 강사가 같은 시간 여러 반 = 세션 수업)

LISTS.seasons.todo=()=>[];/* 281판(대표): 지금 시즌 = 오늘이 든 운영 중 시즌(없으면 오늘이 든 시즌), 시간표 칸 뺌 */const seaNow=()=>{const xs=DB.seasons.filter(z=>!z.del&&!z._virtual&&z.start&&z.start<=TODAY&&(!z.end||TODAY<=z.end));return xs.find(z=>z.state==="확정")||xs[0]||null};
LISTS.seasons.todoSum=()=>{const c=seaNow()||{};const left=c.end?Math.max(0,Math.round((new Date(c.end)-new Date(TODAY))/864e5)):null;return [["지금 시즌",esc(c.name||"—")],["남은 날",left==null?"—":left+"일"]]};

/* 손익 달 줄 → 그 달 결제 내역 */document.addEventListener("click",e=>{const tr=e.target.closest&&e.target.closest("tr[data-id^=\"pf\"]");if(!tr||curScr()!=="profit")return;const st=activeTab.state;if(st.sub==="c")return;e.stopPropagation();e.preventDefault();st.sub="c";st.month=tr.dataset.id.slice(2);st.sel=null;render()},true);
LISTS.profit.todoSum=st=>{const pr=LISTS.profit.rows?LISTS.profit.rows():[];const cur=pr.find(r=>r.m===tMon(st))||pr[0]||{};return [[(cur.m||"")+" 손익",cur.any?WON(cur.net):"자료 없음",cur.net<0?"w":""]]};LISTS.profit.todo=()=>[];
/* 261117 대표: 필터 칩 → 필터 탭. 옛 칩 정의(filters)의 셈을 그대로 가져와 탭으로 — [기본][다른 묶음…] 뒤에 [전체]는 부품이 붙임. 탭으로 안 옮긴 칩은 버림(열 필터·할 일 창으로) */
{const pick=(k,nm,lb)=>{const f=(LISTS[k].filters||[]).find(z=>z[0]===nm);if(!f)throw new Error("필터 탭: "+k+" "+nm);return [lb||nm,lb||nm,f[1]]};
  const FT={events:[["다가오는 일정","다가오는"]],exams:[["다가오는 시험","다가오는"]],classes:[["이 시즌과 겹치는 클래스","이번 시즌"],["종료 예정"]],enrolls:[["종료 빼고","수강 중"],["조정 있음"]],
    progress:[["진행 중"],["다음 교재"],["완료"]],schools:[["학생 있는 학교"]],schools_g:[["켜진 학년"],["학생 있는 학년"]],books:[["사용 중"]],
    bill:[["미납"]],bill_l:[["미납"]],bill_c:[["클래스에 붙음"]],costs:[["지출"],["매출"]]/* 261118 노션 손익 결제 내역 구분 */,reports:[["전송 전"]],completion:[["전송 전"]],letters:[["전송 전"]],tuition:[["미납"],["전송 전"]],alims:[["켜진 것"]],legal_roll:[["수강 중"]]};
  const SAME={events_l:"events",exams_:"exams",exams_c:"exams",schools_s:"schools",books_b:"books",books_p:"books",bill_b:"bill",bill_m:"bill",bill_e:"bill",bookfees:"bill",bookfees_b:"bill",bookfees_m:"bill",bookfees_e:"bill",bookfees_l:"bill_l",charges:"bill_l",etcs:"bill_c"};
  const tabs={};Object.entries(FT).forEach(([k,a])=>{if(LISTS[k])tabs[k]=a.map(([n,lb])=>pick(k,n,lb))});
  tabs.events.push(["학원","학원 일정",x=>evTopOf(x)==="학원 일정"],["학사","학사 일정",x=>evTopOf(x)==="학사 일정"],["할일","할일",x=>evTopOf(x)==="할일"]);/* 261118 대표: 구분 1단계(학원 일정 · 학사 일정 · 할일) = 필터 탭 *//* 학교 일정 세 구분(학교 행사·시험·방학/휴교) + 옛 학사 일정 *//* 261118 대표: 노션 "학사 일정" 표 보기 = 필터 탭 */
  tabs.bill_l.push(["etc","기타경비 줄",x=>x.kind==="기타경비"&&x.item!=="재료비"]);/* 261118 노션 청구서 [기타경비 줄](종류 기타경비 · 항목 재료비 아님) */
  Object.assign(SAME,{bill_a:"bill",profit_c:"costs"});

  tabs.profit=yrs;tabs.profit_p=yrs;
  Object.entries(tabs).forEach(([k,a])=>LISTS[k].ftabs=a);

<script>/* 271판(대표 261115): 긴 글 메모에 노션 글 규칙 — 줄 처음 "- " → "• " 글머리, "1. " 번호 목록. Enter = 같은 목록 다음 줄(번호는 하나 늘림), 빈 목록 줄에서 Enter = 목록 끝 */
(function(){const isMemo=t=>t&&t.tagName==="TEXTAREA"&&(t.closest(".hf-memo")||t.classList.contains("memo"));
  const NL=String.fromCharCode(10);
  const lineAt=(v,pos)=>{const st=v.lastIndexOf(NL,pos-1)+1;return {st,txt:v.slice(st,pos)}};
  const fire=t=>t.dispatchEvent(new Event("input",{bubbles:true}));
  document.addEventListener("input",e=>{const t=e.target;if(!isMemo(t)||e.isComposing)return;const pos=t.selectionStart,{st,txt}=lineAt(t.value,pos);
    if(txt==="- "||txt==="* "){t.value=t.value.slice(0,st)+"• "+t.value.slice(pos);t.selectionStart=t.selectionEnd=st+2;fire(t)}},true);
  document.addEventListener("keydown",e=>{const t=e.target;if(!isMemo(t)||e.key!=="Enter"||e.isComposing||e.shiftKey||e.ctrlKey||e.metaKey)return;const pos=t.selectionStart;if(pos!==t.selectionEnd)return;
    const {st,txt}=lineAt(t.value,pos);const m=txt.match(/^(\s*)(• |(\d+)\. )(.*)$/);if(!m)return;e.preventDefault();
    if(!m[4].trim()){t.value=t.value.slice(0,st)+t.value.slice(pos);t.selectionStart=t.selectionEnd=st;fire(t);return}
    const pre=m[1]+(m[3]?(+m[3]+1)+". ":"• ");t.value=t.value.slice(0,pos)+NL+pre+t.value.slice(pos);t.selectionStart=t.selectionEnd=pos+1+pre.length;fire(t)},true);
})();
</script>
<script>/* 277판(대표 261115 '표와 캘린더 두 탭, 캘린더는 학생 리포트 일정 캘린더 디자인'): 시즌 [표 | 캘린더]. 캘린더 = 3달 나란히, 날짜 칸 아래 색 띠 = 시즌 기간, 점 = 일정(학원·학사·방학·시험·휴원), 날짜를 누르면 아래에 그날 일정 */

  /* 261118: 옛 시즌 달력(구분 칩·학교 고르기·3달)은 일정 달력으로 합쳐 지움 — seasonCal은 일정 › 시즌 타임라인만 그림 */
  window.seasonCal=function(L,st){{if(!st.season||!seasonOf(st.season))st.season=seaToday();queueMicrotask(()=>{const v=document.getElementById("view");if(v&&v.querySelector("#stlT"))bindTitle(v,activeTab)});return `<div class="scal stlwrap">${seasonTimeline(st)}</div>`}};
  /* 280판(대표): 표 탭 없이 캘린더 하나 — 시즌 열기는 범례 칩, 목록은 오른쪽 할 일 창 아래 */LISTS.seasons.cal=true;queueMicrotask(()=>{/* 261118 대표(공용 달력 ② 시즌): 표 탭을 되살려 [표 | 달력 | 타임라인] — 표는 공용 표 + 필터 탭(진행·예정 · 전체), 시험과 같은 모양 *//* 시즌 화면 자체는 없음(일정 › 시즌으로 열림) — 옛 [표|달력|타임라인] 변형은 지움 */
  /* 261118 대표: 시즌은 일정 메뉴 안으로 — 일정 [달력 | 표 | 시즌]. 시즌 탭 = 타임라인 + 오른쪽 기본 창 시즌 목록(줄 누르면 창에서 고침). 시간표에는 시즌 고르기·[운영 시작]만 */
  LISTS.events.subs=[["c","달력"],["l","표"],["s","시즌"]];LISTS.events_s=Object.assign({},LISTS.seasons,{subs:null,cal:true,tl:true,title:"일정",panelName:"시즌"});
[LISTS.seasons,LISTS.events_s].forEach(L=>{const o0=L.onSet;L.onSet=(r,k)=>{if(o0)o0(r,k);if(k==="color"||k==="start"||k==="end")queueMicrotask(render)}});/* 261118 대표: 시즌 색 바꾸면 타임라인 · 달력 선이 바로 */});const seaSt=z=>{if(z.end&&z.end<TODAY)return ["종료","gray"];if(z.start<=TODAY)return z.state==="확정"?["운영 중","green"]:["예정","gray"];const nx=DB.seasons.filter(y=>!y.del&&y.start>TODAY).sort((a,b)=>a.start<b.start?-1:1)[0];return nx&&nx.id===z.id?["다음 시즌","blue"]:["예정","gray"]};
const seaRng=z=>{const a=D10(z.start),b=D10(z.end);return b&&a.slice(0,4)===b.slice(0,4)?`${a} - ${b.slice(5)}`:`${a} - ${b||"…"}`};
LISTS.seasons.todoList=st=>{const all=DB.seasons.filter(z=>!z.del&&!z._virtual).slice().sort((a,b)=>String(a.start).localeCompare(String(b.start)));const past=all.filter(z=>z.end&&z.end<TODAY);return {name:"시즌",rows:st&&st.pastSea?all:all.filter(z=>!past.includes(z)),more:past.length?`<button type="button" class="tdmore" data-pastsea>${IC("search","s")}${st&&st.pastSea?"지난 시즌 숨기기":`지난 시즌 보기 <span class="hint">${past.length}</span>`}</button>`:"",lab:z=>{const [t,c]=seaSt(z);return `<span class="tdr2"><span class="tdr2a"><i class="cdot" style="background:${sHex(z)}"></i><b>${esc(z.name)}</b><span class="pill nc-${c}">${t}</span></span><span class="tdr2b">${seaRng(z)}</span></span>`}}};
