function lessonsOn(date){const out=[];const inS=b=>{const se=seasonOf(b.seasonId);return se&&se.state==="확정"&&!b.del&&inPer(effPeriod(b),date)};

  Object.entries(DB.lov).forEach(([k,o])=>{if(o.d!==date||o.off)return;const [bid,od]=k.split("|");const b=byId(DB.blocks,bid);if(!b)return;if(o.d===od&&o.start===b.start&&o.end===b.end)return;out.push({k,name:cls(b.classId).name,tch:cls(b.classId).teacherId,sids:studentsOfBlock(b).map(x=>x.id),start:o.start,end:o.end})});
  DB.mk.filter(m=>m.d===date&&!m.off).forEach(m=>out.push({k:"mk:"+m.id,name:mkName(m),tch:m.classId?cls(m.classId).teacherId:null,sids:m.sids,start:m.start,end:m.end}));return out}
// 학생마다 겹치는 수업 이름(그 시간), 강사 겹침
function busyAt(date,start,end,selfKey){const st=new Map();let tch=new Map();lessonsOn(date).forEach(l=>{if(l.k===selfKey||!(l.start<end&&start<l.end))return;l.sids.forEach(id=>{if(!st.has(id))st.set(id,`${l.name} ${fmt(l.start)}`)});if(l.tch&&!tch.has(l.tch))tch.set(l.tch,`${l.name} ${fmt(l.start)}`)});return {st,tch}}
function clashToast(date,start,end,sids,tchId,selfKey,prefix){const bz=busyAt(date,start,end,selfKey);const hit=sids.filter(id=>bz.st.has(id));const tb=null; // 강사 겹침은 알리지 않음(같은 강사가 같은 시간 여러 반 = 세션 수업)
  if(!hit.length&&!tb)return toast(prefix);const first=hit[0];toast(`${prefix} — 겹침: ${hit.length?`${stu(first).name}(${bz.st.get(first)})${hit.length>1?` 외 ${hit.length-1}명`:""}`:""}${tb?`${hit.length?" · ":""}강사 ${tch(tchId).name}(${tb})`:""}`)}
function recentAbsent(classId,upto){const out=new Map();DB.blocks.filter(b=>b.classId===classId).forEach(b=>{for(let i=1;i<=28;i++){const d=dPlus(upto,-i);if(dow(d)!==b.day||!lessonMade(b,d))continue;studentsOfBlock(b).forEach(x=>{if(attOf(b,d,x.id)==="결석"&&!out.has(x.id))out.set(x.id,d)})}});return out}
function makeLessons(list){list.forEach(([b,d])=>{DB.made[lkey(b,d)]=true;b.lessons=true});commit()}

/* ===== 위 제목 줄 + 시즌 타임라인(261112 대표) =====

function titleRow(st,s,lesson){const wk=weekOf(st);const isThis=wk.from===weekOf({}).from;const [y,m]=wk.from.split("-").map(Number);

function seaLanes(list){const lanes=[];const out=new Map();list.slice().sort((a,b)=>a.start.localeCompare(b.start)).forEach(x=>{let i=0;while(lanes[i]&&lanes[i]>=x.start)i++;lanes[i]=x.end;out.set(x.id,i)});return {lane:out,n:Math.max(1,lanes.length)}}
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
function tlRange(st){const s=seasonOf(st.season);const a=new Date(s.start+"T12:00:00");a.setMonth(a.getMonth()-3);a.setDate(1);const b=new Date(a);b.setMonth(b.getMonth()+12);b.setDate(0);return {from:ymd(a),to:ymd(b)}}
const dayN=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
function seasonTimeline(st){const R=tlRange(st);const N=dayN(R.from,R.to)+1;const px=d=>Math.max(0,Math.min(100,dayN(R.from,d)/N*100));
  const ms=[];let d=new Date(R.from+"T12:00:00");for(let i=0;i<12;i++){ms.push({d:ymd(d),y:d.getFullYear(),m:d.getMonth()+1});d.setMonth(d.getMonth()+1)}

  const ov=vis.filter(x=>x!==cur&&x.start<=cur.end&&cur.start<=x.end).map(x=>({x,a:x.start>cur.start?x.start:cur.start,b:x.end<cur.end?x.end:cur.end}));

  ${vis.map(x=>`<div class="stl-b ${seaState(x)} ${x.id===st.season?"sel":""}" data-sid="${x.id}" style="left:${px(x.start)}%;width:${px(x.end)-px(x.start)+100/N}%;top:${20+L.lane.get(x.id)*30}px" title="${esc(x.name)} · ${md(x.start)}-${md(x.end)} · ${SEA_W[seaState(x)]}">${x.id===st.season?'<i class="hd l" data-edge="start"></i>':""}<span>${esc(x.name)} · ${SEA_W[seaState(x)]}</span>${x.id===st.season?'<i class="hd r" data-edge="end"></i>':""}</div>`).join("")}
  ${ov.map(o=>`<div class="stl-ov" style="left:${px(o.a)}%;width:${px(o.b)-px(o.a)+100/N}%"></div>`).join("")}

    // 다른 시즌과 겹치지 않게: 앞 시즌 끝 다음 날 ~ 뒤 시즌 시작 전날까지만

  const sb=tr.querySelector(".stl-b.sel");if(sb)sb.onpointerdown=e=>{if(e.target.closest(".hd"))return;e.preventDefault();e.stopPropagation();const s=seasonOf(st.season);const old={start:s.start,end:s.end};const len=dayN(s.start,s.end);const d0=dOf(e.clientX);let moved=false;sb.classList.add("moving");
    const mv=ev=>{const dd=dayN(d0,dOf(ev.clientX));if(!dd&&!moved)return;moved=true;s.start=dPlus(old.start,dd);s.end=dPlus(s.start,len);sb.style.left=(dayN(from,s.start)/N*100)+"%";sb.querySelector("span").textContent=`${s.name} · ${md(s.start)}-${md(s.end)}`};
    const up=()=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);sb.classList.remove("moving");if(!moved||(old.start===s.start&&old.end===s.end))return render();

    document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up)};

function renderLessons(v,t){const st=t.state;const s=seasonOf(st.season);const all=seasonBlocks(t);const wk=weekOf(st);
  if(st.weekend==null)st.weekend=all.some(b=>b.day>=5)&&innerWidth>=1024;const NDAYS=st.weekend?7:5;const [pph]=ZOOM[st.zoom];
  const f=st.filter;const match=b=>{if(f.cls&&b.classId!==f.cls)return false;if(f.tch&&cls(b.classId).teacherId!==f.tch)return false;if(f.stu&&!studentsOfBlock(b).some(x=>x.id===f.stu))return false;return true};const anyFilter=f.cls||f.tch||f.stu;

function startPendingDrag(e,el,t,pph,snap){e.preventDefault();const nb=t.state.pending;const resize=e.target.classList.contains("rz");const sx=e.clientX,sy=e.clientY+SCY(),orig={day:nb.day,start:nb.start,end:nb.end};let moved=false,fol=null;

    const pt=el.querySelector(".pt");if(pt)pt.textContent=`${fmt(nb.start)}-${fmt(nb.end)}`};

/* 좌우 끌기(261112 대표): 블록은 마우스를 그대로 따라가고(옆으로도 부드럽게), 놓일 요일 칸에는 점선 자리가 미리 보인다 */
/* 178판: 끄는 동안 칸 배치 미리 보기 — 끄는 블록은 원래 폭(칸 전체), 놓을 자리 잔상은 실제로 들어갈 자리처럼 겹치면 좁아지고, 그 칸 기존 블록도 같이 좁아짐(놓으면 render로 실제 배치) */

function originGhost(el){if(el._og&&el._og.isConnected)return el._og;const g=document.createElement("div");g.className="origin";g.style.top=el.style.top||el.offsetTop+"px";g.style.height=el.offsetHeight+"px";g.style.left=el.style.left;g.style.width=el.style.width;el.parentElement.appendChild(g);el._og=g;return g}
const magMin=()=>-1; /* 181판: 자석 없앰(대표 — 미세 조정에 방해). 제자리로 돌리기는 끄는 중 Esc */

      if(k==="h"){h=hours[idx];if(!allowed(h,mi)){const mi2=nearest("m",mins.indexOf(mi));mi=mins[mi2];scrollTo("m",mi2,true)}}else mi=mins[idx];paint()},110)});
    col.addEventListener("click",e=>{const it=e.target.closest(".tw-it");if(!it||it.classList.contains("dis"))return;scrollTo(k,[...col.children].indexOf(it),true)});
    // 163판: 마우스 휠 한 칸 = 한 칸(시 1시간·분 5분). 사용성 시험: 휠 한 번에 3칸씩 넘어갔음. 터치패드는 40px마다 한 칸
    let acc=0;col.addEventListener("wheel",e=>{e.preventDefault();acc+=e.deltaMode===1?e.deltaY*40:e.deltaY;if(Math.abs(acc)<40&&e.deltaMode===0&&Math.abs(e.deltaY)<40)return;const list=k==="h"?hours:mins;const dir=Math.sign(acc);acc=0;let idx=Math.round(col.scrollTop/ITEM)+dir;idx=Math.max(0,Math.min(list.length-1,idx));scrollTo(k,idx,true)},{passive:false});

/* 운영 중 블록의 요일·시간을 바꾸면: "언제부터?" → 그날부터 새 시간표로 나눔(예전 것은 전날까지, 지난 수업·기록은 그대로) */

function stuModal(opt){const st={q:"",grade:"",scope:"all",free:!!opt.busy,picked:new Set(opt.picked||[]),from:opt.from||""};

    const row=x=>{const bz=opt.busy?opt.busy(x.id):null;if(bz&&st.free)return "";return PK.row(x,{attr:`data-sm="${x.id}"`,checked:st.picked.has(x.id),dis:!!bz,title:bz?"이 시간에 다른 수업이 있어요":"",sub:opt.sub?opt.sub(x.id):"",...stuClsBz(x.id,bz)})};

  modal(`<h2>${esc(opt.title)}${opt.help?HELP(opt.help):""}</h2>

  ${c?combo("smS",[{v:"all",label:"전체"},{v:"in",label:`${c.name} 수강생`},{v:"out",label:"다른 학생"}],"all","전체","layers",true):""}

  <div class="actions"><span class="hint" id="smN">0명 선택</span><span class="sp"></span><button class="btn" id="smC">취소</button><button class="btn pri" id="smO" disabled>${opt.okLabel||"넣기"}</button></div>`,(m,close)=>{

function pickStudents(title,classId,block,done){
  const st={q:"",grade:"",scope:"all",free:true,picked:new Set()};
  const inClass=sid=>DB.enrolls.some(e=>e.studentId===sid&&e.classId===classId&&!e.ended);
  const busy=sid=>block&&DB.blocks.some(b=>b!==block&&b.seasonId===block.seasonId&&b.day===block.day&&b.start<block.end&&block.start<b.end&&b.regs.some(r=>{const e=enr(r);return e&&e.studentId===sid}));
  const draw=(m)=>{const list=DB.students.filter(s=>(!st.q||s.name.includes(st.q))&&(!st.grade||s.grade===st.grade)&&(st.scope==="all"||(st.scope==="in"?inClass(s.id):!inClass(s.id)))&&(!st.free||!busy(s.id))&&!(block&&block.regs&&block.regs.some(r=>{const e=enr(r);return e&&e.studentId===s.id})));
    m.querySelector(".picklist").innerHTML=list.map(s=>`<label class="pr" style="cursor:pointer"><input type="checkbox" data-id="${s.id}" ${st.picked.has(s.id)?"checked":""}>${stuHtml(s)}${busy(s.id)?'<span class="tag w">이 시간 다른 수업</span>':''}<span class="m">${inClass(s.id)?"이 클래스":"클래스에 없음"}</span></label>`).join("")||'<div class="empty">맞는 학생이 없어요</div>';
    m.querySelectorAll("[data-id]").forEach(c=>c.onchange=()=>{c.checked?st.picked.add(c.dataset.id):st.picked.delete(c.dataset.id);m.querySelector("#pkN").textContent=st.picked.size+"명 선택"})};
  const grades=[...new Set(DB.students.map(s=>s.grade).filter(Boolean))].sort();
  modal(`<h2>${esc(title)}${HELP("클래스에 없는 학생을 고르면 수강이 함께 생겨요.")}</h2><div class="bar2"><input class="inp" id="pkQ" placeholder="이름 찾기" style="flex:1"><select class="chip" id="pkG"><option value="">학년</option>${grades.map(g=>`<option>${g}</option>`).join("")}</select><select class="chip" id="pkS"><option value="all">전체</option><option value="in">이 클래스 학생</option><option value="out">클래스에 없는 학생</option></select><label class="ckchip"><input type="checkbox" id="pkF" checked> 이 시간 비어 있는 학생만</label></div><div class="picklist"></div><div class="actions"><span id="pkN" class="hint">0명 선택</span><span class="sp"></span><button class="btn" id="pkC">취소</button><button class="btn pri" id="pkOk">넣기</button></div>`,(m,close)=>{
    draw(m);m.querySelector("#pkQ").oninput=e=>{st.q=e.target.value;draw(m)};m.querySelector("#pkG").onchange=e=>{st.grade=e.target.value;draw(m)};m.querySelector("#pkS").onchange=e=>{st.scope=e.target.value;draw(m)};m.querySelector("#pkF").onchange=e=>{st.free=e.target.checked;draw(m)};

    const t=bill||{id:sid,studentId:l0.studentId,classId:l0.classId,month:l0.month,how:""};

    if(st0.pending){st0.pending=null;st0.panel=null;st0.nqFocused=false;toast("새 시간표를 취소했어요");render();return}

    // 163판: 만들던 것이 없으면 Esc 한 번 더 = [추가]·[보강] 모드 끝(사용성 시험: Esc로 모드가 안 꺼졌음)
    if(st0.view!=="lesson"&&st0.mode==="add"){st0.mode="edit";toast("추가 모드를 끝냈어요");render();return}if(st0.view==="lesson"&&st0.lmode==="mk"){st0.lmode="att";toast("보강 모드를 끝냈어요");render();return}
    if(!dockOn)closePanel(activeTab);return}
  if(activeTab.screen!=="timetable"||typing)return;const st=activeTab.state;

<script>
/* 237판: 합친 칸(학생·학교·학년)이 있는 표에서 아래 줄을 골라도 합친 칸에 고른 표시(대표 요청) */
(function(){let busy=false;
function mgSel(){busy=true;try{document.querySelectorAll("table.stt td.mgsel").forEach(td=>td.classList.remove("mgsel","mgfirst"));document.querySelectorAll("table.stt tr.mgcov").forEach(tr=>tr.classList.remove("mgcov"));
  document.querySelectorAll("table.stt tr.sel").forEach(sel=>{const rows=[...sel.parentNode.children];const si=rows.indexOf(sel);let hit=false;
    for(let i=si;i>=0;i--){rows[i].querySelectorAll("td[data-mg]").forEach(td=>{const span=+td.getAttribute("rowspan")||1;if(i+span>si){td.classList.add("mgsel");hit=true}})}
    if(!hit)return;sel.classList.add("mgcov");const first=[...sel.parentNode.querySelectorAll("td.mgsel")].sort((x,y)=>x.cellIndex-y.cellIndex)[0];if(first)first.classList.add("mgfirst")})}finally{busy=false}}
let q=0;const mo=new MutationObserver(()=>{if(busy||q)return;q=requestAnimationFrame(()=>{q=0;mgSel()})});
mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:["class"]});
/* 238판: 합친 칸에서 마우스 높이에 있는 줄 = 고를 줄 */
const rowAt=(td,y)=>{const tr=td.parentNode,span=+td.getAttribute("rowspan")||1;let r=tr;for(let i=0;i<span&&r;i++,r=r.nextElementSibling){const b=r.getBoundingClientRect();if(y>=b.top&&y<b.bottom)return r}return tr};
const clr=()=>document.querySelectorAll("table.t tr.mghov,table.t tr.mgnohov").forEach(r=>r.classList.remove("mghov","mgnohov"));
document.addEventListener("mousemove",e=>{const td=e.target.closest&&e.target.closest("table.t td[data-mg]");if(!td){if(document.querySelector("table.t tr.mghov,table.t tr.mgnohov"))clr();return}const r=rowAt(td,e.clientY),tr=td.parentNode;busy=true;try{clr();if(r!==tr){r.classList.add("mghov");tr.classList.add("mgnohov")}}finally{busy=false}},true);
document.addEventListener("click",e=>{const td=e.target.closest&&e.target.closest("table.t td[data-mg]");if(!td)return;const r=rowAt(td,e.clientY);if(r===td.parentNode)return;const c=r.querySelector("td:not([data-mg]):not(.op)");if(!c)return;e.stopPropagation();e.preventDefault();c.click()},true);
})();
</script>
